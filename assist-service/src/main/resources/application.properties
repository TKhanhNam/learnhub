spring.application.name=assist-service
server.port=8088
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/assist_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:nam123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_SECRET:LearnHub-Shared-Secret-Key-2026-Doi-Trong-Moi-Truong-That}
internal.api-key=${INTERNAL_KEY:learnhub-internal-key-2026}
spring.config.import=optional:classpath:assist-secrets.properties
assist.catalog-url=${CATALOG_URL:http://localhost:8082}
assist.identity-url=${IDENTITY_URL:http://localhost:8081}
assist.commerce-url=${COMMERCE_URL:http://localhost:8085}
assist.learning-url=${LEARNING_URL:http://localhost:8083}
assist.user-model=${ASSIST_USER_MODEL:openai/gpt-4o-mini}
assist.admin-model=${ASSIST_ADMIN_MODEL:anthropic/claude-haiku-4.5}
assist.site.phone=${ASSIST_SITE_PHONE:}
assist.site.founded-year=${ASSIST_SITE_FOUNDED:}
assist.site.email=${ASSIST_SITE_EMAIL:}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId}] %logger{20} - %msg%n
