spring.application.name=payment-service
server.port=8089
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:nam123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
jwt.secret=${JWT_SECRET:LearnHub-Shared-Secret-Key-2026-Doi-Trong-Moi-Truong-That}
internal.api-key=${INTERNAL_KEY:learnhub-internal-key-2026}
spring.config.import=optional:classpath:payment-secrets.properties
bank.link.secret=${PAYMENT_LINK_SECRET:lh-payment-link-secret-change-me-2026}
bank.link.client-id=payment-service
bank.link.protect=/link/
bank.link.allow=commerce-service,payment-service
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.verify-ssl=${MOMO_VERIFY_SSL:true}
momo.request-type=${MOMO_REQUEST_TYPE:payWithCC}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/api/payment/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}
payment.commerce-url=${COMMERCE_URL:http://localhost:8085}
payment.web-result-url=${WEB_RESULT_URL:http://localhost:5173/payment/result}
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId}] %logger{20} - %msg%n
