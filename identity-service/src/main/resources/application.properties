spring.application.name=identity-service
server.port=8081

# ================= Database rieng cua service (Database per Service) =================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/identity_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:nam123}

# Schema do Flyway quan ly bang code, KHONG sua DB bang tay (file cong nghe loi muc 4)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Connection Pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ================= JWT =================
# Access token song ngan, refresh token song dai va luu ban bam trong DB
jwt.secret=${JWT_SECRET:LearnHub-Shared-Secret-Key-2026-Doi-Trong-Moi-Truong-That}
jwt.access-expiration-ms=1800000
jwt.refresh-expiration-ms=604800000

# Cookie chua refresh token (HttpOnly de chong XSS)
auth.refresh-cookie-name=learnhub_refresh
auth.refresh-cookie-secure=false

# ================= Khoa goi API noi bo giua cac service =================
internal.api-key=${INTERNAL_KEY:learnhub-internal-key-2026}

# Email khoa tai khoan. Dat MAIL_HOST (vd smtp.gmail.com) de gui that qua SMTP.
learnhub.mail.from=${MAIL_FROM:LearnHub <no-reply@learnhub.vn>}
learnhub.mail.outbox-dir=${MAIL_OUTBOX_DIR:mail-outbox}
learnhub.mail.host=${MAIL_HOST:}

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [trace=%X{traceId}] %logger{20} - %msg%n
